<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무관리">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>개인 업무 관리 시스템</title>
<!-- 개발용 진입점. 로컬 서버(python -m http.server)로 열어야 함. 배포용 단일 파일은 build.py로 생성 -->
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<script src="vendor/ds-bundle.js"></script>
<script src="vendor/msgreader.js"></script>
<!-- 호스팅 시 같은 폴더의 pms.config.js 가 있으면 Supabase 주소·키 등을 자동 적용 (없어도 무방) -->
<script src="pms.config.js"></script>
<style id="pms-responsive">
/* 폰: 모달·카드가 화면을 넘지 않게 */
@media (max-width:860px){
  [role="dialog"],[class*="modal"]>div{max-width:96vw!important;width:96vw!important;}
  main{overflow-x:hidden;}
  /* 넓은 표는 잘리지 않게 자기 칸 안에서 좌우로 민다 */
  main table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;}
  main table thead,main table tbody{display:table;width:max-content;min-width:100%;}
  main pre{overflow-x:auto;}
}
html,body{overscroll-behavior-y:contain;}
</style>
</head><body><div id="root"></div>
<!-- 순서 중요: store → shared → Login → Mail → Calendar → Wiki → Knowledge → App -->
<script type="text/babel" src="src/store.jsx"></script>
<script type="text/babel" src="src/shared.jsx"></script>
<script type="text/babel" src="src/Files.jsx"></script>
<script type="text/babel" src="src/Audio.jsx"></script>
<script type="text/babel" src="src/Live.jsx"></script>
<script type="text/babel" src="src/gmail.jsx"></script>
<script type="text/babel" src="src/Login.jsx"></script>
<script type="text/babel" src="src/Mail.jsx"></script>
<script type="text/babel" src="src/Calendar.jsx"></script>
<script type="text/babel" src="src/Wiki.jsx"></script>
<script type="text/babel" src="src/Vault.jsx"></script>
<script type="text/babel" src="src/Knowledge.jsx"></script>
<script type="text/babel" src="src/App.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById('root')).render(<PmsApp/>);</script>
</body></html>
